name: Repository checks

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkpoint documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/project-plan.md
          test -s docs/tooling.md
          test -s docs/architecture-contract.md
          python3 scripts/check_flash_layout.py
          git diff --check

  lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf \
            device-tree-compiler libboost-dev libboost-regex-dev libboost-system-dev
      - name: Build pinned Spike with commit logging
        run: bash scripts/setup_spike.sh > spike-setup.log 2>&1 || { tail -80 spike-setup.log; exit 1; }
      - name: Compare retirements and prove first-divergence halt
        run: bash scripts/run_lockstep_smoke.sh --self-test
      - name: Run five-stage CPU slice and UART hang checks
        run: bash scripts/run_core_slice.sh

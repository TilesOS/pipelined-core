name: Repository checks

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkpoint documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/project-plan.md
          test -s docs/tooling.md
          test -s docs/architecture-contract.md
          python3 scripts/check_flash_layout.py
          git diff --check

  lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf \
            device-tree-compiler libboost-dev libboost-regex-dev libboost-system-dev \
            autoconf flex bison
      - name: Build pinned Spike with commit logging
        run: bash scripts/setup_spike.sh > spike-setup.log 2>&1 || { tail -80 spike-setup.log; exit 1; }
      - name: Compare retirements and prove first-divergence halt
        run: bash scripts/run_lockstep_smoke.sh --self-test
      - name: Run CPU lockstep, UART, M/A/CSR tests and hazard/trap cross coverage
        run: bash scripts/run_cpu_coverage.sh
      - name: Run cached CPU, full FENCE.I, and DMA-window tests
        run: bash scripts/run_checkpoint9.sh
      - name: Upload CPU functional coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-functional-coverage
          path: |
            build/coverage/baseline.json
            build/coverage/seed-replay.json
            build/coverage/summary.json
            build/coverage/summary.txt
            build/coverage/run-*/*.dat
          if-no-files-found: warn

  axi-bus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Run checkpoint 7 dual-clock AXI tests
        run: bash scripts/run_checkpoint7.sh

name: Repository checks

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkpoint documentation
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/project-plan.md
          test -s docs/tooling.md
          git diff --check

# RTL lint and simulation jobs are added with checkpoint 3, after those tools exist.
